name: Deploy site

# Rebuilds and publishes the app whenever code or the synced catalog changes,
# so the live site always serves the latest daily sync.
on:
  push:
    branches: [claude/grants-vc-funding-tracker-3d1w9b]
  # The sync job's commits are made with the default GITHUB_TOKEN, and GitHub
  # deliberately excludes GITHUB_TOKEN-authored pushes from re-triggering
  # push-triggered workflows (anti-recursion). Without this, the site never
  # picks up the daily catalog updates. workflow_run isn't gated that way.
  workflow_run:
    workflows: [Daily source sync]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # For workflow_run, only proceed if the sync run itself succeeded (or was
    # skipped because nothing changed) — not if it errored outright.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'skipped'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run always targets the default branch unless told
          # otherwise; pin to the branch the sync actually ran on.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # enablement:true creates the Pages site on first run, so no manual
      # Settings → Pages step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
